sip:
  host: "voice.navaphone.com"
  port: 5060
  username: "YOUR_SIP_USERNAME"
  password: "YOUR_SIP_PASSWORD"
  from_number: "YOUR_FROM_NUMBER"
  transport: "udp"
  expires: 3600
  user_agent: "Nimfadora/0.1.0"

media:
  rtp_port_min: 16384
  rtp_port_max: 32766
  sample_rate: 8000
  channels: 1
  frame_size_ms: 20

tts:
  voice: "fa-IR-DilaraNeural"
  rate: "+0%"
  volume: "+10%"

brain:
  base_url: "https://api.example.com/v1"
  api_key: "YOUR_API_KEY"
  model: "gpt-4o"
  max_tokens: 200
  temperature: 0.7

agent:
  name: "Nimfadora"
  persona_path: "persona.md"
  capabilities:
    - sip_voice
    - mcp_gateway
    - code_exec
    - browser
